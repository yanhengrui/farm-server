version: "2"

run:
  tests: true

linters:
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - vendor
      - .ai-rules
      - ai-workflow
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - vendor
      - .ai-rules
      - ai-workflow
      - third_party$
      - builtin$
      - examples$
