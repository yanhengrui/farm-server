syntax = "proto3";

package farm.internal.v1;

option go_package = "github.com/photon/farm-server/server/gen/farm/rpc/v1;rpcv1";

import "google/protobuf/timestamp.proto";

service TaskService {
  rpc IncrProgress(IncrProgressRequest) returns (IncrProgressResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc ClaimReward(ClaimRewardRequest) returns (ClaimRewardResponse);
}

message TaskProgress {
  string task_key = 1;
  string description = 2;
  int32 progress = 3;
  int32 target = 4;
  string status = 5;
  int64 coin_reward = 6;
  google.protobuf.Timestamp updated_at = 7;
}
message IncrProgressRequest {
  int64 user_id = 1;
  string task_key = 2;
  int32 delta = 3;
}
message IncrProgressResponse {}
message ListTasksRequest { int64 user_id = 1; }
message ListTasksResponse { repeated TaskProgress tasks = 1; }
message ClaimRewardRequest {
  int64 user_id = 1;
  string task_key = 2;
}
message ClaimRewardResponse { int64 coin_reward = 1; }
